<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agendador de WhatsApp</title>
<style>
  :root { --verde:#1f8f5f; --verde-claro:#e7f5ee; --cinza:#6b7280; --borda:#e5e7eb; --fundo:#f6f7f9; --vermelho:#c0392b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--fundo); color:#111827; }
  header { background:#fff; border-bottom:1px solid var(--borda); padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  .status { font-size:13px; padding:4px 10px; border-radius:999px; background:#fef3c7; color:#92400e; text-decoration:none; }
  .status.ok { background:var(--verde-claro); color:var(--verde); }
  main { max-width:980px; margin:0 auto; padding:20px; display:grid; grid-template-columns: 360px 1fr; gap:20px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .card { background:#fff; border:1px solid var(--borda); border-radius:12px; padding:18px; }
  .card h2 { font-size:15px; margin:0 0 14px; }
  label { display:block; font-size:13px; color:var(--cinza); margin:12px 0 4px; }
  input, select, textarea { width:100%; padding:9px 10px; border:1px solid var(--borda); border-radius:8px; font:inherit; font-size:14px; background:#fff; }
  textarea { min-height:90px; resize:vertical; }
  .linha { display:flex; gap:8px; }
  .linha > * { flex:1; }
  button { font:inherit; font-size:14px; border:0; border-radius:8px; padding:10px 14px; cursor:pointer; }
  .primario { background:var(--verde); color:#fff; width:100%; margin-top:16px; }
  .secundario { background:#fff; border:1px solid var(--borda); color:#111827; width:100%; margin-top:8px; }
  .mini { padding:5px 9px; font-size:12px; background:#fff; border:1px solid var(--borda); }
  .mini.perigo { color:var(--vermelho); }
  #preview { max-width:100%; max-height:160px; border-radius:8px; margin-top:8px; display:none; }
  .msg { font-size:13px; margin-top:10px; min-height:18px; }
  .msg.erro { color:var(--vermelho); } .msg.ok { color:var(--verde); }
  .filtros { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .filtros button { padding:5px 10px; font-size:12px; background:#fff; border:1px solid var(--borda); }
  .filtros button.ativo { background:#111827; color:#fff; border-color:#111827; }
  .item { border:1px solid var(--borda); border-radius:10px; padding:12px; margin-bottom:10px; display:flex; gap:12px; }
  .item img { width:64px; height:64px; object-fit:cover; border-radius:8px; background:var(--fundo); }
  .item .corpo { flex:1; min-width:0; }
  .item .topo { display:flex; justify-content:space-between; gap:8px; font-size:13px; }
  .item .texto { font-size:14px; margin:6px 0; white-space:pre-wrap; word-break:break-word; }
  .item .rodape { display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--cinza); }
  .tag { font-size:11px; padding:2px 8px; border-radius:999px; background:var(--fundo); }
  .tag.pendente { background:#dbeafe; color:#1e40af; } .tag.enviado { background:var(--verde-claro); color:var(--verde); }
  .tag.erro, .tag.expirado { background:#fde2e1; color:var(--vermelho); } .tag.cancelado { color:var(--cinza); }
  .grupos-box { border:1px solid var(--borda); border-radius:8px; max-height:220px; overflow-y:auto; margin-top:6px; }
  .grupos-box label { display:flex; align-items:center; gap:8px; margin:0; padding:8px 10px; color:#111827; font-size:14px; cursor:pointer; border-bottom:1px solid var(--borda); }
  .grupos-box label:last-child { border-bottom:0; }
  .grupos-box label:hover { background:var(--fundo); }
  .grupos-box input { width:auto; margin:0; }
  .grupos-acoes { display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--cinza); margin-top:6px; }
  .grupos-acoes button { padding:0; background:none; color:var(--verde); font-size:12px; }
  .horario { display:flex; gap:6px; margin-bottom:6px; }
  .horario button { padding:0 12px; background:#fff; border:1px solid var(--borda); color:var(--vermelho); }
  button.link { padding:0; background:none; color:var(--verde); font-size:13px; margin-top:2px; }

  /* ---------- cabeçalho ---------- */
  .topo-dir { display:flex; align-items:center; gap:10px; }
  .ajuda { width:30px; height:30px; padding:0; border-radius:50%; background:#fff; border:1px solid var(--borda); color:var(--cinza); font-weight:600; }
  .ajuda:hover { color:var(--verde); border-color:var(--verde); }

  /* ---------- tour de boas-vindas ---------- */
  .tour-bloqueio { position:fixed; inset:0; z-index:1000; }
  .tour-luz {
    position:fixed; z-index:1001; border-radius:12px; pointer-events:none;
    box-shadow:0 0 0 9999px rgba(17,24,39,.55), 0 0 0 3px rgba(31,143,95,.9);
    transition: top .45s cubic-bezier(.4,0,.2,1), left .45s cubic-bezier(.4,0,.2,1),
                width .45s cubic-bezier(.4,0,.2,1), height .45s cubic-bezier(.4,0,.2,1),
                box-shadow .3s ease, opacity .3s ease;
  }
  .tour-luz.centro { box-shadow:0 0 0 9999px rgba(17,24,39,.55), 0 0 0 0 rgba(31,143,95,0); }
  .tour-luz.pulsa::after {
    content:''; position:absolute; inset:-3px; border-radius:inherit; border:3px solid var(--verde);
    animation: tourPulso 1.6s ease-out infinite;
  }
  @keyframes tourPulso { from { opacity:.9; transform:scale(1); } to { opacity:0; transform:scale(1.06); } }

  .tour-caixa {
    position:fixed; z-index:1002; width:min(340px, calc(100vw - 24px));
    background:#fff; border-radius:14px; padding:18px 18px 14px;
    box-shadow:0 18px 50px rgba(0,0,0,.28);
    opacity:0; transform:translateY(10px) scale(.96);
    transition: opacity .28s ease, transform .32s cubic-bezier(.34,1.56,.64,1);
  }
  .tour-caixa.visivel { opacity:1; transform:none; }
  .tour-caixa.saindo { opacity:0; transform:translateY(-8px) scale(.97); transition: opacity .18s ease, transform .18s ease; }
  .tour-caixa.larga { width:min(420px, calc(100vw - 24px)); text-align:center; }
  .tour-seta {
    position:absolute; width:14px; height:14px; background:#fff; transform:rotate(45deg);
    transition:left .3s ease;
  }
  .tour-caixa[data-lado="baixo"] .tour-seta { top:-7px; }
  .tour-caixa[data-lado="cima"] .tour-seta { bottom:-7px; }
  .tour-caixa.larga .tour-seta { display:none; }
  .tour-emoji { font-size:34px; line-height:1; margin-bottom:8px; }
  .tour-caixa h3 { margin:0 0 6px; font-size:16px; }
  .tour-caixa p { margin:0; font-size:14px; color:#374151; line-height:1.5; }
  .tour-caixa p + p { margin-top:8px; }
  .tour-rodape { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px; }
  .tour-pontos { display:flex; gap:5px; margin-top:14px; }
  .tour-caixa.larga .tour-pontos { justify-content:center; }
  .tour-pular { white-space:nowrap; }
  .tour-pontos span { width:6px; height:6px; border-radius:99px; background:var(--borda); transition:width .3s ease, background .3s ease; }
  .tour-pontos span.ativo { width:18px; background:var(--verde); }
  .tour-botoes { display:flex; gap:6px; }
  .tour-botoes button { padding:7px 12px; font-size:13px; }
  .tour-pular { background:none; color:var(--cinza); padding-left:0 !important; }
  .tour-voltar { background:#fff; border:1px solid var(--borda); }
  .tour-proximo { background:var(--verde); color:#fff; }
  .tour-caixa.larga .tour-rodape { flex-direction:column-reverse; gap:4px; }
  .tour-caixa.larga .tour-botoes { width:100%; }
  .tour-caixa.larga .tour-botoes button { flex:1; padding:10px; }

  @media (prefers-reduced-motion: reduce) {
    .tour-luz, .tour-caixa, .tour-caixa.saindo, .tour-pontos span { transition:none; }
    .tour-luz.pulsa::after { animation:none; }
  }
  dialog { border:0; border-radius:12px; padding:0; width:min(440px, 94vw); box-shadow:0 20px 50px rgba(0,0,0,.25); }
  dialog::backdrop { background:rgba(17,24,39,.45); }
  dialog form { padding:18px; max-height:88vh; overflow-y:auto; }
  dialog h2 { font-size:16px; margin:0 0 4px; }
  dialog .sub { font-size:13px; color:var(--cinza); margin:0 0 6px; }
  .foto-atual { display:flex; align-items:center; gap:10px; margin-top:6px; }
  .foto-atual img { width:72px; height:72px; object-fit:cover; border-radius:8px; border:1px solid var(--borda); }
  .check { display:flex; gap:8px; align-items:flex-start; color:#111827; font-size:13px; margin-top:12px; }
  .check input { width:auto; margin-top:2px; }
  .acoes-modal { display:flex; gap:8px; margin-top:16px; }
  .acoes-modal button { flex:1; margin:0; }
  .vazio { color:var(--cinza); font-size:14px; text-align:center; padding:30px 0; }
</style>
</head>
<body>
<header>
  <h1>📅 Agendador de WhatsApp</h1>
  <div class="topo-dir">
    <a id="status" class="status" href="/qr">verificando...</a>
    <button type="button" id="btnTour" class="ajuda" title="Ver o tour de novo" aria-label="Ver o tour de novo">?</button>
  </div>
</header>

<main>
  <section class="card" id="secaoNova">
    <h2>Nova mensagem</h2>
    <form id="form">
      <label>Enviar para</label>
      <select id="tipo">
        <option value="contato">Contato (número)</option>
        <option value="grupo">Grupo</option>
      </select>

      <div id="campoNumero">
        <label>Número com DDD</label>
        <input id="numero" placeholder="45 99999-9999" inputmode="tel">
        <label>Nome (opcional, só pra você saber quem é)</label>
        <input id="nome" placeholder="Ex.: Mãe">
      </div>
      <div id="campoGrupo" hidden>
        <label>Grupos (pode marcar vários)</label>
        <input id="buscaGrupo" placeholder="Buscar grupo...">
        <div id="listaGrupos" class="grupos-box"><div class="vazio">Carregando grupos...</div></div>
        <div class="grupos-acoes">
          <span id="contGrupos">0 selecionados</span>
          <button type="button" id="limparGrupos">limpar seleção</button>
        </div>
      </div>

      <label>Mensagem (vira legenda se tiver foto)</label>
      <textarea id="mensagem" placeholder="Escreva a mensagem..."></textarea>

      <label>Foto (opcional)</label>
      <input id="foto" type="file" accept="image/*">
      <img id="preview" alt="">

      <label>Repetir</label>
      <select id="recorrencia">
        <option value="nenhuma">Não repetir</option>
        <option value="diaria">Todo dia</option>
        <option value="semanal">Toda semana</option>
        <option value="mensal">Todo mês</option>
      </select>

      <div id="blocoUnico">
        <label id="rotuloDataHora">Data e hora</label>
        <input id="dataHora" type="datetime-local">
      </div>

      <div id="blocoDiario" hidden>
        <label>Começa em</label>
        <input id="inicio" type="date">
        <label>Horários (envia em todos, todo dia)</label>
        <div id="horarios"></div>
        <button type="button" class="link" id="addHorario">+ adicionar horário</button>
      </div>

      <div id="blocoFim" hidden>
        <label>Termina em (opcional — vazio = repete pra sempre)</label>
        <input id="fim" type="date">
      </div>

      <button class="primario" type="submit" id="btnAgendar">Agendar</button>
      <button class="secundario" type="button" id="btnTeste">Enviar agora (teste)</button>
      <div id="msg" class="msg"></div>
    </form>
  </section>

  <section class="card" id="secaoLista">
    <h2>Agendamentos</h2>
    <div class="filtros" id="filtros">
      <button data-f="pendente" class="ativo">Pendentes</button>
      <button data-f="enviado">Enviados</button>
      <button data-f="problema">Com problema</button>
      <button data-f="todos">Todos</button>
    </div>
    <div id="lista"><div class="vazio">Carregando...</div></div>
  </section>
</main>

<dialog id="editor">
  <form id="formEditar">
    <h2>Alterar agendamento</h2>
    <p class="sub" id="edDestino"></p>

    <label>Mensagem</label>
    <textarea id="edMensagem"></textarea>

    <label>Foto</label>
    <div class="foto-atual" id="edFotoAtual" hidden>
      <img id="edFotoImg" alt="Foto atual">
      <label class="check" style="margin:0"><input type="checkbox" id="edRemoverFoto"> remover foto</label>
    </div>
    <input id="edFoto" type="file" accept="image/*" style="margin-top:6px">
    <small style="color:var(--cinza)">Escolha uma imagem só se quiser trocar a foto.</small>

    <div class="linha">
      <div>
        <label>Próximo envio</label>
        <input id="edDataHora" type="datetime-local" required>
      </div>
      <div>
        <label>Repetir</label>
        <select id="edRecorrencia">
          <option value="nenhuma">Não repetir</option>
          <option value="diaria">Todo dia</option>
          <option value="semanal">Toda semana</option>
          <option value="mensal">Todo mês</option>
        </select>
      </div>
    </div>
    <div id="edBlocoFim">
      <label>Termina em (opcional)</label>
      <input id="edFim" type="date">
    </div>

    <label class="check" id="edLoteBox" hidden>
      <input type="checkbox" id="edLote" checked>
      <span id="edLoteTexto"></span>
    </label>

    <div class="acoes-modal">
      <button type="button" class="secundario" id="edCancelar">Fechar</button>
      <button type="submit" class="primario">Salvar</button>
    </div>
    <div id="edMsg" class="msg"></div>
  </form>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
let agendamentos = [];
let filtro = 'pendente';
let grupos = [];

const rotulos = { nenhuma: '', diaria: '🔁 todo dia', semanal: '🔁 toda semana', mensal: '🔁 todo mês' };
const fmt = (iso) => new Date(iso).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function mostrar(texto, tipo = '') { const m = $('msg'); m.textContent = texto; m.className = 'msg ' + tipo; }

// ----- datas e horários -----
const local = (d) => new Date(d - d.getTimezoneOffset() * 60000).toISOString(); // "AAAA-MM-DDTHH:MM" no fuso do navegador

function padraoDatas() {
  const d = new Date(Date.now() + 60 * 60 * 1000); d.setSeconds(0, 0);
  $('dataHora').value = local(d).slice(0, 16);
  $('inicio').value = local(new Date()).slice(0, 10);
  $('fim').value = '';
  $('horarios').innerHTML = '';
  adicionarHorario('08:00');
}

function adicionarHorario(valor = '') {
  const linha = document.createElement('div');
  linha.className = 'horario';
  linha.innerHTML = '<input type="time" required><button type="button" title="Remover">×</button>';
  linha.querySelector('input').value = valor;
  linha.querySelector('button').onclick = () => {
    if ($('horarios').children.length > 1) linha.remove();
  };
  $('horarios').appendChild(linha);
}
$('addHorario').onclick = () => adicionarHorario();

$('recorrencia').onchange = () => {
  const r = $('recorrencia').value;
  $('blocoDiario').hidden = r !== 'diaria';
  $('blocoUnico').hidden = r === 'diaria';
  $('blocoFim').hidden = r === 'nenhuma';
  $('rotuloDataHora').textContent = r === 'nenhuma' ? 'Data e hora' : 'Primeiro envio';
};
padraoDatas();

// Monta a lista de datas do primeiro envio (uma por horário no diário) + término
function lerDatas() {
  const r = $('recorrencia').value;
  let datas;
  if (r === 'diaria') {
    if (!$('inicio').value) throw new Error('Escolha a data de início');
    const horas = [...$('horarios').querySelectorAll('input')].map((i) => i.value).filter(Boolean);
    if (!horas.length) throw new Error('Coloque pelo menos um horário');
    datas = [...new Set(horas)].sort().map((h) => new Date(`${$('inicio').value}T${h}`));
  } else {
    if (!$('dataHora').value) throw new Error('Escolha a data e a hora');
    datas = [new Date($('dataHora').value)];
  }
  if (datas.some((d) => Number.isNaN(d.getTime()))) throw new Error('Data/hora inválida');
  const fim = r !== 'nenhuma' && $('fim').value ? new Date(`${$('fim').value}T23:59:59`) : null;
  if (fim && datas.every((d) => d > fim)) throw new Error('A data de término é antes do início');
  return { datas, fim };
}

$('tipo').onchange = () => {
  const grupo = $('tipo').value === 'grupo';
  $('campoGrupo').hidden = !grupo; $('campoNumero').hidden = grupo;
  if (grupo && !grupos.length) carregarGrupos();
};

$('foto').onchange = () => {
  const f = $('foto').files[0];
  $('preview').style.display = f ? 'block' : 'none';
  if (f) $('preview').src = URL.createObjectURL(f);
};

async function carregarStatus() {
  try {
    const { status } = await (await fetch('/api/status')).json();
    const el = $('status');
    const textos = { conectado: '● conectado', aguardando_qr: 'escanear QR code →', desconectado: 'desconectado (reconectando...)', iniciando: 'iniciando...' };
    el.textContent = textos[status] || status;
    el.className = 'status' + (status === 'conectado' ? ' ok' : '');
  } catch { $('status').textContent = 'sem resposta'; }
}

const selecionados = new Set();

async function carregarGrupos() {
  const r = await fetch('/api/grupos');
  if (!r.ok) { $('listaGrupos').innerHTML = '<div class="vazio">WhatsApp desconectado</div>'; return; }
  grupos = await r.json();
  renderizarGrupos();
}

function renderizarGrupos() {
  const busca = $('buscaGrupo').value.trim().toLowerCase();
  const visiveis = grupos.filter((g) => g.nome.toLowerCase().includes(busca));
  $('listaGrupos').innerHTML = visiveis.length
    ? visiveis.map((g) => `<label><input type="checkbox" value="${esc(g.id)}" ${selecionados.has(g.id) ? 'checked' : ''}> ${esc(g.nome)}</label>`).join('')
    : '<div class="vazio">Nenhum grupo encontrado</div>';
  $('contGrupos').textContent = `${selecionados.size} selecionado${selecionados.size === 1 ? '' : 's'}`;
}

$('listaGrupos').onchange = (e) => {
  if (e.target.type !== 'checkbox') return;
  e.target.checked ? selecionados.add(e.target.value) : selecionados.delete(e.target.value);
  $('contGrupos').textContent = `${selecionados.size} selecionado${selecionados.size === 1 ? '' : 's'}`;
};
$('buscaGrupo').oninput = renderizarGrupos;
$('limparGrupos').onclick = () => { selecionados.clear(); renderizarGrupos(); };

async function carregar() {
  const r = await fetch('/api/agendamentos');
  agendamentos = r.ok ? await r.json() : [];
  renderizar();
}

function renderizar() {
  let itens = agendamentos;
  if (filtro === 'pendente') itens = itens.filter((a) => a.status === 'pendente' || a.status === 'enviando').reverse();
  if (filtro === 'enviado') itens = itens.filter((a) => a.status === 'enviado');
  if (filtro === 'problema') itens = itens.filter((a) => ['erro', 'expirado'].includes(a.status));
  if (!itens.length) { $('lista').innerHTML = '<div class="vazio">Nada por aqui.</div>'; return; }

  $('lista').innerHTML = itens.map((a) => `
    <div class="item">
      <div class="corpo">
        <div class="topo"><strong>${esc(a.destino_nome || a.destino)}</strong><span class="tag ${a.status}">${a.status}</span></div>
        <div class="texto">${esc(a.mensagem || '(só foto)')}</div>
        <div class="rodape">
          <span>${a.status === 'enviado' && a.enviado_em ? 'enviado ' + fmt(a.enviado_em) : (a.recorrencia !== 'nenhuma' ? 'próximo: ' : '') + fmt(a.data_hora)}</span>
          ${a.foto_path ? '<span class="tag">🖼️ com foto</span>' : ''}
          <span>${rotulos[a.recorrencia] || ''}${a.termina_em ? ' até ' + new Date(a.termina_em).toLocaleDateString('pt-BR') : ''}</span>
          ${a.erro ? `<span style="color:var(--vermelho)">${esc(a.erro)}</span>` : ''}
          <span style="flex:1"></span>
          ${['pendente', 'erro', 'expirado', 'cancelado'].includes(a.status) ? `<button class="mini" onclick="abrirEditor('${a.id}')">Alterar</button>` : ''}
          ${['pendente', 'erro'].includes(a.status) ? `<button class="mini" onclick="cancelar('${a.id}')">Cancelar</button>` : ''}
          <button class="mini perigo" onclick="excluir('${a.id}')">Excluir</button>
        </div>
      </div>
    </div>`).join('');
}

$('filtros').onclick = (e) => {
  if (!e.target.dataset.f) return;
  filtro = e.target.dataset.f;
  [...$('filtros').children].forEach((b) => b.classList.toggle('ativo', b === e.target));
  renderizar();
};

function montarDados() {
  const fd = new FormData();
  if ($('tipo').value === 'grupo') {
    if (!selecionados.size) throw new Error('Marque pelo menos um grupo');
    const lista = [...selecionados].map((id) => ({ id, nome: grupos.find((g) => g.id === id)?.nome || '' }));
    fd.append('destinos', JSON.stringify(lista));
  } else {
    const numero = $('numero').value.replace(/\D/g, '');
    if (numero.length < 10) throw new Error('Número inválido (coloque o DDD)');
    fd.append('destino', numero);
    fd.append('destino_nome', $('nome').value);
  }
  fd.append('mensagem', $('mensagem').value);
  if ($('foto').files[0]) fd.append('foto', $('foto').files[0]);
  if (!$('mensagem').value.trim() && !$('foto').files[0]) throw new Error('Escreva uma mensagem ou escolha uma foto');
  return fd;
}

$('form').onsubmit = async (e) => {
  e.preventDefault();
  try {
    const fd = montarDados();
    const { datas, fim } = lerDatas();
    fd.append('datas', JSON.stringify(datas.map((d) => d.toISOString())));
    if (fim) fd.append('termina_em', fim.toISOString());
    fd.append('recorrencia', $('recorrencia').value);
    mostrar('Salvando...');
    const r = await fetch('/api/agendamentos', { method: 'POST', body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.erro);
    const primeiro = j.map((a) => a.data_hora).sort()[0];
    mostrar(`${j.length > 1 ? j.length + ' agendamentos criados' : 'Agendado'} — primeiro envio ${fmt(primeiro)} ✅`, 'ok');
    $('mensagem').value = ''; $('foto').value = ''; $('preview').style.display = 'none';
    carregar();
  } catch (err) { mostrar(err.message, 'erro'); }
};

$('btnTeste').onclick = async () => {
  try {
    const fd = montarDados();
    mostrar('Enviando... (pode levar alguns segundos com vários grupos)');
    const r = await fetch('/api/teste', { method: 'POST', body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.erro);
    mostrar(j.enviados > 1 ? `Enviado para ${j.enviados} grupos ✅` : 'Mensagem de teste enviada ✅', 'ok');
  } catch (err) { mostrar(err.message, 'erro'); }
};

async function cancelar(id) {
  await fetch(`/api/agendamentos/${id}/cancelar`, { method: 'POST' }); carregar();
}
async function excluir(id) {
  if (!confirm('Excluir este agendamento?')) return;
  await fetch(`/api/agendamentos/${id}`, { method: 'DELETE' }); carregar();
}

// ----- editar -----
let editando = null;
const editaveis = ['pendente', 'erro', 'expirado'];

function abrirEditor(id) {
  const a = agendamentos.find((x) => x.id === id);
  if (!a) return;
  editando = a;
  $('edDestino').textContent = 'Para: ' + (a.destino_nome || a.destino) + (a.status === 'cancelado' ? ' — salvar reativa o envio' : '');
  $('edMensagem').value = a.mensagem || '';
  $('edDataHora').value = local(new Date(a.data_hora)).slice(0, 16);
  $('edRecorrencia').value = a.recorrencia;
  $('edFim').value = a.termina_em ? local(new Date(a.termina_em)).slice(0, 10) : '';
  $('edBlocoFim').hidden = a.recorrencia === 'nenhuma';
  $('edFoto').value = '';
  $('edRemoverFoto').checked = false;
  $('edFotoAtual').hidden = !a.foto_path;
  if (a.foto_path) $('edFotoImg').src = `/api/agendamentos/${a.id}/foto?v=${encodeURIComponent(a.foto_path)}`;

  const irmaos = a.lote ? agendamentos.filter((x) => x.lote === a.lote && x.id !== a.id && editaveis.includes(x.status)).length : 0;
  $('edLoteBox').hidden = !irmaos;
  $('edLote').checked = true;
  $('edLoteTexto').textContent = `Alterar o texto e a foto também nos outros ${irmaos} agendamento${irmaos > 1 ? 's' : ''} criado${irmaos > 1 ? 's' : ''} junto (outros grupos/horários). Data e repetição mudam só neste.`;
  $('edMsg').textContent = '';
  $('editor').showModal();
}

$('edRecorrencia').onchange = () => { $('edBlocoFim').hidden = $('edRecorrencia').value === 'nenhuma'; };
$('edCancelar').onclick = () => $('editor').close();

$('formEditar').onsubmit = async (e) => {
  e.preventDefault();
  const msg = $('edMsg');
  try {
    const quando = new Date($('edDataHora').value);
    if (Number.isNaN(quando.getTime())) throw new Error('Data/hora inválida');
    const fd = new FormData();
    fd.append('mensagem', $('edMensagem').value);
    fd.append('data_hora', quando.toISOString());
    fd.append('recorrencia', $('edRecorrencia').value);
    fd.append('termina_em', $('edRecorrencia').value !== 'nenhuma' && $('edFim').value ? new Date(`${$('edFim').value}T23:59:59`).toISOString() : '');
    if ($('edRemoverFoto').checked) fd.append('remover_foto', '1');
    if ($('edFoto').files[0]) fd.append('foto', $('edFoto').files[0]);
    if (!$('edLoteBox').hidden && $('edLote').checked) fd.append('aplicar_lote', '1');

    msg.textContent = 'Salvando...'; msg.className = 'msg';
    const r = await fetch(`/api/agendamentos/${editando.id}`, { method: 'PATCH', body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.erro);
    $('editor').close();
    mostrar(j.outros_atualizados ? `Alterado (e mais ${j.outros_atualizados}) ✅` : 'Agendamento alterado ✅', 'ok');
    carregar();
  } catch (err) { msg.textContent = err.message; msg.className = 'msg erro'; }
};

// ================= TOUR DE BOAS-VINDAS =================
const PASSOS = [
  { emoji: '👋', titulo: 'Bem-vinda ao Agendador!',
    texto: ['Aqui você programa mensagens e fotos pro WhatsApp e elas saem sozinhas, na hora certa — pra contatos ou grupos.',
            'Vou te mostrar rapidinho como funciona. Leva menos de um minuto.'] },
  { alvo: '#status', titulo: 'Conexão com o WhatsApp',
    texto: ['Mostra se o seu WhatsApp está conectado. Precisa estar <b>verde</b> pras mensagens saírem.',
            'Se pedir QR code, clique aqui e escaneie em <i>Dispositivos conectados</i> no celular.'] },
  { alvo: '#tipo', titulo: 'Pra quem enviar',
    texto: ['Escolha <b>Contato</b> e digite o número com DDD, ou <b>Grupo</b> pra marcar um ou vários grupos de uma vez.'] },
  { alvo: '#mensagem', titulo: 'A mensagem',
    texto: ['Escreva o texto aqui. Se você anexar uma foto, esse texto vai como legenda dela.'] },
  { alvo: '#foto', titulo: 'Foto (opcional)',
    texto: ['Dá pra mandar só texto, só foto, ou os dois juntos.'] },
  { alvo: '#recorrencia', titulo: 'Repetir',
    texto: ['Envio único, ou repetir <b>todo dia</b>, <b>toda semana</b> ou <b>todo mês</b>.',
            'No “todo dia” você escolhe quando começa e pode colocar vários horários por dia.'] },
  { alvo: '#btnAgendar', titulo: 'Agendar',
    texto: ['Salva o agendamento. A partir daí é com o sistema — pode fechar a página que a mensagem sai no horário.'] },
  { alvo: '#btnTeste', titulo: 'Testar antes',
    texto: ['Manda a mensagem <b>na hora</b>, sem agendar. Bom pra conferir se o texto e a foto ficaram do jeito que você quer.'] },
  { alvo: '#secaoLista', titulo: 'Seus agendamentos',
    texto: ['Tudo que está programado aparece aqui, com o status de cada um.',
            'Use <b>Alterar</b> pra mudar texto, foto ou horário, <b>Cancelar</b> pra parar e <b>Excluir</b> pra apagar.'] },
  { emoji: '🎉', titulo: 'Tudo pronto!',
    texto: ['Agora é só agendar a primeira mensagem.',
            'Se quiser ver este tour de novo, é só clicar no <b>?</b> lá em cima.'] },
];

const CHAVE_TOUR = 'agendador_tour_visto_v1';
const semAnimacao = matchMedia('(prefers-reduced-motion: reduce)').matches;
const tour = { i: 0, el: null, luz: null, caixa: null, alvo: null, ocupado: false };

function tourJaVisto() { try { return localStorage.getItem(CHAVE_TOUR) === '1'; } catch { return false; } }
function marcarTourVisto() { try { localStorage.setItem(CHAVE_TOUR, '1'); } catch { /* sem storage: mostra de novo na próxima, sem problema */ } }

function iniciarTour() {
  if (tour.el) return;
  if ($('editor').open) $('editor').close();
  tour.i = 0;
  tour.el = document.createElement('div');
  tour.el.innerHTML = `
    <div class="tour-bloqueio"></div>
    <div class="tour-luz centro"></div>
    <div class="tour-caixa" role="dialog" aria-modal="true" aria-live="polite">
      <div class="tour-seta"></div>
      <div class="tour-conteudo"></div>
      <div class="tour-pontos">${PASSOS.map(() => '<span></span>').join('')}</div>
      <div class="tour-rodape">
        <button type="button" class="tour-pular">Pular tour</button>
        <div class="tour-botoes">
          <button type="button" class="tour-voltar">Voltar</button>
          <button type="button" class="tour-proximo">Próximo</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(tour.el);
  tour.luz = tour.el.querySelector('.tour-luz');
  tour.caixa = tour.el.querySelector('.tour-caixa');
  // a luz começa no centro, pequena, e "abre" até o primeiro alvo
  Object.assign(tour.luz.style, { top: innerHeight / 2 + 'px', left: innerWidth / 2 + 'px', width: '0px', height: '0px' });

  tour.el.querySelector('.tour-pular').onclick = () => fecharTour();
  tour.el.querySelector('.tour-voltar').onclick = () => irPara(tour.i - 1);
  tour.el.querySelector('.tour-proximo').onclick = () => (tour.i === PASSOS.length - 1 ? fecharTour() : irPara(tour.i + 1));
  tour.el.querySelector('.tour-bloqueio').onclick = () => tour.caixa.animate(
    [{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(0)' }],
    { duration: 260 });
  addEventListener('keydown', teclasTour);
  addEventListener('resize', reposicionar);
  addEventListener('scroll', reposicionar, { passive: true });
  mostrarPasso(0, true);
}

function teclasTour(e) {
  if (e.key === 'Escape') fecharTour();
  else if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); tour.el.querySelector('.tour-proximo').click(); }
  else if (e.key === 'ArrowLeft' && tour.i > 0) irPara(tour.i - 1);
}

function irPara(i) {
  if (tour.ocupado || i < 0 || i >= PASSOS.length) return;
  tour.ocupado = true;
  tour.caixa.classList.remove('visivel');
  tour.caixa.classList.add('saindo');
  setTimeout(() => mostrarPasso(i), semAnimacao ? 0 : 180);
}

function mostrarPasso(i, primeiro = false) {
  tour.i = i;
  const p = PASSOS[i];
  tour.alvo = p.alvo ? document.querySelector(p.alvo) : null;
  if (tour.alvo && tour.alvo.offsetParent === null) tour.alvo = tour.alvo.closest('.card') || null; // alvo escondido

  tour.el.querySelector('.tour-conteudo').innerHTML =
    (p.emoji ? `<div class="tour-emoji">${p.emoji}</div>` : '') +
    `<h3>${p.titulo}</h3>` + p.texto.map((t) => `<p>${t}</p>`).join('');
  tour.el.querySelectorAll('.tour-pontos span').forEach((s, n) => s.classList.toggle('ativo', n === i));
  tour.el.querySelector('.tour-voltar').hidden = i === 0;
  tour.el.querySelector('.tour-pular').hidden = i === PASSOS.length - 1;
  tour.el.querySelector('.tour-proximo').textContent =
    i === 0 ? 'Começar' : i === PASSOS.length - 1 ? 'Concluir' : 'Próximo';
  tour.caixa.classList.toggle('larga', !tour.alvo);

  const exibir = () => {
    reposicionar();
    tour.caixa.classList.remove('saindo');
    requestAnimationFrame(() => {
      tour.caixa.classList.add('visivel');
      tour.ocupado = false;
      tour.el.querySelector('.tour-proximo').focus({ preventScroll: true });
    });
  };

  if (tour.alvo) {
    const r = tour.alvo.getBoundingClientRect();
    const foraDaTela = r.top < 70 || r.bottom > innerHeight - 20;
    if (foraDaTela) {
      tour.alvo.scrollIntoView({ block: 'center', behavior: semAnimacao ? 'auto' : 'smooth' });
      setTimeout(exibir, semAnimacao ? 0 : 380);
      return;
    }
  }
  primeiro ? requestAnimationFrame(exibir) : exibir();
}

function reposicionar() {
  if (!tour.el) return;
  const margem = 8;
  const caixa = tour.caixa;

  if (!tour.alvo) {
    // passo sem alvo: luz fecha no centro e a caixa fica no meio da tela
    tour.luz.classList.add('centro');
    tour.luz.classList.remove('pulsa');
    Object.assign(tour.luz.style, { top: innerHeight / 2 + 'px', left: innerWidth / 2 + 'px', width: '0px', height: '0px' });
    caixa.removeAttribute('data-lado');
    caixa.style.left = Math.max(12, (innerWidth - caixa.offsetWidth) / 2) + 'px';
    caixa.style.top = Math.max(12, (innerHeight - caixa.offsetHeight) / 2) + 'px';
    return;
  }

  const r = tour.alvo.getBoundingClientRect();
  tour.luz.classList.remove('centro');
  tour.luz.classList.add('pulsa');
  Object.assign(tour.luz.style, {
    top: r.top - margem + 'px', left: r.left - margem + 'px',
    width: r.width + margem * 2 + 'px', height: r.height + margem * 2 + 'px',
  });

  const largura = caixa.offsetWidth;
  const altura = caixa.offsetHeight;
  const espacoBaixo = innerHeight - r.bottom;
  const lado = espacoBaixo > altura + 30 || espacoBaixo > r.top ? 'baixo' : 'cima';
  let top = lado === 'baixo' ? r.bottom + margem + 14 : r.top - margem - 14 - altura;
  top = Math.min(Math.max(12, top), innerHeight - altura - 12);
  let left = r.left + r.width / 2 - largura / 2;
  left = Math.min(Math.max(12, left), innerWidth - largura - 12);

  caixa.dataset.lado = lado;
  caixa.style.top = top + 'px';
  caixa.style.left = left + 'px';
  const centroAlvo = r.left + r.width / 2 - left;
  caixa.querySelector('.tour-seta').style.left = Math.min(Math.max(16, centroAlvo - 7), largura - 30) + 'px';
}

function fecharTour() {
  if (!tour.el) return;
  marcarTourVisto();
  removeEventListener('keydown', teclasTour);
  removeEventListener('resize', reposicionar);
  removeEventListener('scroll', reposicionar);
  const el = tour.el;
  tour.el = null;
  tour.caixa.classList.remove('visivel');
  tour.caixa.classList.add('saindo');
  tour.luz.style.opacity = '0';
  setTimeout(() => el.remove(), semAnimacao ? 0 : 300);
}

$('btnTour').onclick = iniciarTour;
if (!tourJaVisto()) setTimeout(iniciarTour, 600);

carregarStatus(); carregar();
setInterval(carregarStatus, 10000);
setInterval(carregar, 30000);
</script>
